name: Desktop build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag containing the matching runner binaries
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      CSC_LINK: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify exact release checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Download and verify matching runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_ASSET: useagent-runner-darwin-${{ matrix.arch }}
        run: |
          mkdir -p apps/desktop/resources/runner
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RUNNER_ASSET" \
            --dir apps/desktop/resources/runner

          expected_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            | jq -r --arg asset "$RUNNER_ASSET" '.assets[] | select(.name == $asset) | .digest')"
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          actual_digest="sha256:$(shasum -a 256 "apps/desktop/resources/runner/$RUNNER_ASSET" | cut -d' ' -f1)"
          test "$actual_digest" = "$expected_digest"
          expected_arch="${{ matrix.arch }}"
          test "$expected_arch" != x64 || expected_arch=x86_64
          lipo -archs "apps/desktop/resources/runner/$RUNNER_ASSET" | tr ' ' '\n' | grep -Fx "$expected_arch"
          chmod 755 "apps/desktop/resources/runner/$RUNNER_ASSET"

      - name: Validate desktop shell
        working-directory: apps/desktop
        run: bun run typecheck && bun test

      - name: Build signed and notarized packages
        working-directory: apps/desktop
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}"
          done
          bun run build
          bunx electron-builder \
            --config electron-builder.config.cjs \
            --mac dmg zip \
            --${{ matrix.arch }} \
            --publish never

      - name: Upload desktop packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UseAgent-${{ github.run_id }}-darwin-${{ matrix.arch }}
          path: |
            apps/desktop/dist/packages/UseAgent-*-darwin-${{ matrix.arch }}.dmg
            apps/desktop/dist/packages/UseAgent-*-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30
