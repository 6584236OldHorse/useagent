name: Runner binaries

# Builds the per-machine runner for every platform the desktop shell packages
# and attaches the binaries to a prerelease named after the commit, so the
# shell can fetch them by the exact asset names in the runner contract.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - packages/runner/**
      - packages/runner-protocol/**
      - .github/workflows/runner-binaries.yml

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  build:
    name: Build and publish runner binaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the protocol package
        working-directory: packages/runner-protocol
        run: bun install --frozen-lockfile
      - name: Install the runner
        working-directory: packages/runner
        run: bun install --frozen-lockfile
      - name: Build every target
        working-directory: packages/runner
        run: bun run build
      - name: List the assets
        run: ls -la packages/runner/dist
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="runner-${GITHUB_SHA::9}"
          gh release create "$tag" packages/runner/dist/useagent-runner-* \
            --prerelease \
            --title "Runner $tag" \
            --notes "Per-machine runner built from ${GITHUB_SHA} by workflow run ${GITHUB_RUN_ID}. Assets carry the names in the runner contract; verify a download against the checksums in the run summary." \
            --target "$GITHUB_SHA"
          {
            echo "## Runner binaries $tag"
            echo
            echo '```'
            (cd packages/runner/dist && sha256sum useagent-runner-*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
