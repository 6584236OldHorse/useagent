name: Local sandbox image

# The image a developer's machine boots for local sandboxes, for amd64 and
# arm64: the public base in deploy/local-sandbox/Dockerfile.base with the native
# recipe rendered on top. Published to GHCR with its digest recorded, which is
# what a deployment sets as SANDBOX_IMAGE_REF and SANDBOX_IMAGE_DIGEST so every
# runner pulls and verifies the same bits.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - deploy/local-sandbox/**
      - backend/runtime-assets/**
      - backend/src/sandboxes/native-image.ts
      - backend/scripts/render-native-image.ts
      - .github/workflows/local-sandbox-image.yml

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

concurrency:
  group: local-sandbox-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each platform builds on its own native runner: the recipe's steps use sudo,
  # which the emulated build cannot run. The manifest job joins the two.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - platform: linux/arm64
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    outputs:
      name: ${{ steps.render.outputs.name }}
      base-amd64: ${{ steps.digests.outputs.base-amd64 }}
      base-arm64: ${{ steps.digests.outputs.base-arm64 }}
      sandbox-amd64: ${{ steps.digests.outputs.sandbox-amd64 }}
      sandbox-arm64: ${{ steps.digests.outputs.sandbox-arm64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install backend dependencies for the renderer
        run: |
          for p in packages/*/; do
            if [ -f "$p/package.json" ]; then (cd "$p" && bun install --frozen-lockfile); fi
          done
          (cd backend && bun install --frozen-lockfile)

      - name: Stage native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run deploy/stage-native-runtime.ts

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the base for this platform
        id: base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: deploy/local-sandbox
          file: deploy/local-sandbox/Dockerfile.base
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/useagenthq/sandbox-base:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=useAgent local sandbox base
          cache-from: type=gha,scope=local-sandbox-base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=local-sandbox-base-${{ matrix.arch }}

      - name: Render the native recipe for the local layout
        id: render
        working-directory: backend
        run: |
          bun run scripts/render-native-image.ts --out ../render --layout local
          echo "name=$(cat ../render/name)" >> "$GITHUB_OUTPUT"

      - name: Build and publish the sandbox image for this platform
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: render
          file: render/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            USEAGENT_NATIVE_BASE_IMAGE=ghcr.io/useagenthq/sandbox-base@${{ steps.base.outputs.digest }}
          tags: ghcr.io/useagenthq/sandbox:${{ steps.render.outputs.name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=useAgent local sandbox

      - name: Publish this platform's digests
        id: digests
        env:
          ARCH: ${{ matrix.arch }}
          BASE: ${{ steps.base.outputs.digest }}
          SANDBOX: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$BASE" && test -n "$SANDBOX"
          echo "base-${ARCH}=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sandbox-${ARCH}=${SANDBOX}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the multi-platform image
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the platforms into one image
        id: join
        env:
          NAME: ${{ needs.build.outputs.name }}
          BASE_AMD64: ${{ needs.build.outputs.base-amd64 }}
          BASE_ARM64: ${{ needs.build.outputs.base-arm64 }}
          SANDBOX_AMD64: ${{ needs.build.outputs.sandbox-amd64 }}
          SANDBOX_ARM64: ${{ needs.build.outputs.sandbox-arm64 }}
        run: |
          test -n "$NAME" && test -n "$BASE_AMD64" && test -n "$BASE_ARM64" && test -n "$SANDBOX_AMD64" && test -n "$SANDBOX_ARM64"
          docker buildx imagetools create \
            --tag "ghcr.io/useagenthq/sandbox-base:sha-${GITHUB_SHA}" \
            "ghcr.io/useagenthq/sandbox-base@${BASE_AMD64}" "ghcr.io/useagenthq/sandbox-base@${BASE_ARM64}"
          docker buildx imagetools create \
            --tag "ghcr.io/useagenthq/sandbox:${NAME}" \
            --tag "ghcr.io/useagenthq/sandbox:main" \
            "ghcr.io/useagenthq/sandbox@${SANDBOX_AMD64}" "ghcr.io/useagenthq/sandbox@${SANDBOX_ARM64}"
          digest=$(docker buildx imagetools inspect "ghcr.io/useagenthq/sandbox:${NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Record the image reference and digest
        shell: bash
        env:
          NAME: ${{ needs.build.outputs.name }}
          DIGEST: ${{ steps.join.outputs.digest }}
        run: |
          test -n "$DIGEST"
          jq -n --arg ref "ghcr.io/useagenthq/sandbox:${NAME}" --arg digest "$DIGEST" \
            '{SANDBOX_IMAGE_REF: $ref, SANDBOX_IMAGE_DIGEST: $digest}' > local-sandbox-image.json
          cat local-sandbox-image.json
          {
            echo "## Local sandbox image"
            echo
            echo '```'
            cat local-sandbox-image.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-sandbox-image-${{ github.run_id }}
          path: local-sandbox-image.json
          if-no-files-found: error
          retention-days: 90
